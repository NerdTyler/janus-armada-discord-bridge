[package]
name = "janus-armada"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Janus bridge, host side: PCM socket server + mixer + Armada (Concord) leg. Joins voice only when summoned."

[[bin]]
name = "janus-armada"
path = "src/main.rs"

[dependencies]
concord-voice = { path = "../crates/concord-voice" }
pcm-protocol = { path = "../crates/pcm-protocol" }
vector_sdk = { version = "0.12", features = ["voice"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
nostr-sdk = "=0.45.6"
